<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#faf7f0'><title>Container Checker</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#faf7f0;color:#252525}.wrap{max-width:680px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:6px 0}p{color:#666}.card{background:white;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0000000d}label{font-weight:650;display:block;margin:14px 0 6px}input,select,textarea,button{font:inherit;width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff}input[type=file]{padding:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{background:#252525;color:#fff;border:0;font-weight:700;margin-top:16px}.secondary{background:#eee;color:#222}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#eee;font-size:13px}.result{font-weight:800;font-size:18px}.entry{border-top:1px solid #eee;padding:12px 0}.entry img{max-width:100%;border-radius:12px;margin-top:8px}.small{font-size:13px;color:#777}.hidden{display:none}</style></head><body><div class='wrap'><div class='head'><div><h1>📦 Container Checker</h1><div class='small'>BudgetRoy • shop, check, save</div></div><span class='pill'>A4 = 297 × 210 mm</span></div>
<div class='card'><h2>1. Shop & item</h2><label>Shop</label><input id='shop' placeholder='e.g. PEP Home'><label>Date</label><input id='date' type='date'><label>Container / product</label><input id='name' placeholder='e.g. Clear clip-lock box'><label>Role</label><select id='role'><option>Small stationery</option><option>A4 books / files</option><option>Active-use stock</option><option>Reserve / backstock</option><option>Other</option></select><label>Price (R)</label><input id='price' type='number' step='.01' inputmode='decimal'></div>
<div class='card'><h2>2. Will it fit?</h2><div class='small'>Use internal dimensions if you can measure them.</div><label>Usable internal dimensions (mm)</label><div class='three'><input id='l' type='number' placeholder='Length'><input id='w' type='number' placeholder='Width'><input id='h' type='number' placeholder='Height'></div><label>Advertised capacity (litres, optional)</label><input id='litres' type='number' step='.1' inputmode='decimal'><label>Cupboard / shelf fit?</label><select id='shelf'><option value='unknown'>Not checked</option><option value='yes'>Yes</option><option value='no'>No</option></select></div>
<div class='card'><h2>3. Evidence</h2><label>Photo</label><input id='photo' type='file' accept='image/*' capture='environment'><label>Product URL</label><input id='url' type='url' placeholder='https://…'><label>Notes</label><textarea id='notes' rows='3' placeholder='Clip quality, stackability, lid, etc.'></textarea></div>
<div class='card'><h2>4. Verdict</h2><div id='verdict' class='result'>Enter price and measurements.</div><div id='calc' class='small'></div><button onclick='save()'>Save Container</button><button class='secondary' onclick='resetForm()'>Clear</button></div>
<div class='card'><h2>Saved checks</h2><div id='history'></div></div></div><script>
const $=id=>document.getElementById(id); $('date').value=new Date().toISOString().slice(0,10); ['price','l','w','h','litres','role','shelf'].forEach(x=>$(x).addEventListener('input',calc));
function calc(){let p=+$('price').value,l=+$('l').value,w=+$('w').value,h=+$('h').value,lit=+$('litres').value;let role=$('role').value;let a4=(l>=297&&w>=210)||(w>=297&&l>=210);let fit=role==='A4 books / files'?(a4?'✓ A4 should fit flat':'✗ A4 fit not confirmed'):'';let zone=p?(p<=50?'GOOD BUY zone':p<=100?'Within R100 cap':'OVER R100 cap'):'';let ppl=p&&lit?(p/lit).toFixed(2):'';$('verdict').textContent=[zone,fit].filter(Boolean).join(' • ')||'Enter price and measurements.';$('calc').textContent=ppl?'R'+ppl+' per advertised litre':'';}
function getPhoto(cb){let f=$('photo').files[0];if(!f)return cb('');let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function save(){getPhoto(photo=>{let d={id:Date.now(),shop:$('shop').value,date:$('date').value,name:$('name').value,role:$('role').value,price:$('price').value,l:$('l').value,w:$('w').value,h:$('h').value,litres:$('litres').value,shelf:$('shelf').value,url:$('url').value,notes:$('notes').value,photo};let arr=JSON.parse(localStorage.getItem('containers')||'[]');arr.unshift(d);try{localStorage.setItem('containers',JSON.stringify(arr))}catch(e){d.photo='';localStorage.setItem('containers',JSON.stringify([d,...arr]));alert('Saved, but the photo was too large for local storage.')}render();resetForm(false)})}
function resetForm(clearShop=true){['name','price','l','w','h','litres','url','notes','photo'].forEach(x=>$(x).value='');if(clearShop)$('shop').value='';$('date').value=new Date().toISOString().slice(0,10);calc()}
function del(id){let a=JSON.parse(localStorage.getItem('containers')||'[]').filter(x=>x.id!==id);localStorage.setItem('containers',JSON.stringify(a));render()}
function render(){let a=JSON.parse(localStorage.getItem('containers')||'[]');$('history').innerHTML=a.length?a.map(x=>`<div class='entry'><b>${x.shop||'Unknown shop'} — ${x.name||'Container'}</b><br><span class='small'>${x.date} • ${x.role} • R${x.price||'?'} • ${x.l||'?'}×${x.w||'?'}×${x.h||'?'} mm</span>${x.url?`<br><a href='${x.url}' target='_blank'>Open product URL</a>`:''}${x.notes?`<div>${x.notes}</div>`:''}${x.photo?`<img src='${x.photo}'>`:''}<button class='secondary' onclick='del(${x.id})'>Delete</button></div>`).join(''):'<div class="small">Nothing saved yet.</div>'}render();calc();
</script></body></html>
